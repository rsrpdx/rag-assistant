spring:
  datasource:
    url: jdbc:mysql://mysql:3306/rag_assistant?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:rag_user}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 3000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.rag.assistant.module.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境不把每条 SQL 打到标准输出，避免日志膨胀与 I/O 开销
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET}
  access-token-expire: 86400000
  refresh-token-expire: 2592000000

rag:
  qdrant:
    host: qdrant
    port: 6334
    collection: rag_knowledge
    dimension: 512
  search:
    max-results: 5
    # 真实文档单块 vs 提问最低 0.42，阈值取 0.4 以保证召回
    min-score: 0.4
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LLM_API_KEY}
    chat-model: ${LLM_CHAT_MODEL:deepseek-chat}
    temperature: 0.7
    max-tokens: 2048
  doc:
    chunk:
      max-size: 500
      overlap: 50
  minio:
    endpoint: http://minio:9000
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:https://fearless.website}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: rag-files

logging:
  level:
    com.rag.assistant: info
