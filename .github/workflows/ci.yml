name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: 后端编译与单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # EmbeddingQualityTest 首次运行会下载 bge-small-zh-v15 的 ONNX 模型
      - name: 缓存 Embedding 模型
        uses: actions/cache@v6
        with:
          path: ~/.djl.ai
          key: djl-bge-small-zh-v15-${{ runner.os }}

      - name: 运行测试
        run: mvn -B test

      - name: 打包（跳过测试）
        run: mvn -B package -DskipTests

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: 配置 Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查并构建
        run: npm run build